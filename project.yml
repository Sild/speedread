name: FastReader

options:
  bundleIdPrefix: com.sild
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: false
  groupSortPosition: top
  indentWidth: 4
  tabWidth: 4
  xcodeVersion: "26.6"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.8.0

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1,2

targets:
  FastReader:
    type: application
    platform: iOS
    sources:
      - path: FastReader
    resources:
      - path: FastReader/Resources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.fastreader
        PRODUCT_NAME: FastReader
        SUPPORTS_MACCATALYST: NO
    info:
      path: FastReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: FastReader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: false

  FastReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FastReaderTests
    dependencies:
      - target: FastReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.fastreader.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FastReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FastReader

  FastReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FastReaderUITests
      - path: FastReaderTests/Fixtures/epub3-cyrillic.epub
        buildPhase: resources
      - path: FastReaderTests/Fixtures/pdf-metadata-outline.pdf
        buildPhase: resources
      - path: FastReaderTests/Fixtures/pdf-image-only.pdf
        buildPhase: resources
      - path: FastReaderTests/Fixtures/pdf-long-scanned.pdf
        buildPhase: resources
    dependencies:
      - target: FastReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.fastreader.uitests
        TEST_TARGET_NAME: FastReader

schemes:
  FastReader:
    build:
      targets:
        FastReader: all
        FastReaderTests: [test]
        FastReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      testPlans:
        - path: Config/TestPlans/FastReaderUnit.xctestplan
        - path: Config/TestPlans/FastReaderFull.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
