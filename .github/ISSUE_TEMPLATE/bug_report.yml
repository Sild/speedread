name: Bug report
description: Report a reproducible problem in SpeedRead.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private books, Apple account data, or security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpeedRead version
      placeholder: 1.0 (build 1)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: iPhone 17 Pro, iOS 26.0
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Publication format
      options:
        - Not applicable
        - EPUB
        - PDF
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Add non-sensitive logs or screenshots. Do not upload copyrighted books.
