name: Full Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned tool versions
        id: tool-versions
        run: |
          source Tools/versions.env
          echo "key=$XCODEGEN_VERSION-$SWIFTFORMAT_VERSION-$SWIFTLINT_VERSION-$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "### Full-validation durations" >> "$GITHUB_STEP_SUMMARY"
          echo "| Phase | Result | Tests | Duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | ---: |" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.build/tools
          key: speedread-tools-${{ runner.os }}-${{ steps.tool-versions.outputs.key }}

      - name: Select Xcode 26.6
        run: |
          xcode_path=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode 26.6 is unavailable on this runner."
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install pinned tools
        timeout-minutes: 2
        run: ./Tools/install_tools.sh

      - name: Run preflight and static checks
        timeout-minutes: 3
        run: |
          started=$SECONDS
          make version-check tooling-check cloudkit-check app-store-check project-check format-check lint
          echo "| Preflight and static checks | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run native logic tests
        timeout-minutes: 2
        run: |
          started=$SECONDS
          make logic-test
          echo "| Native logic tests | Passed | 17 | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Start simulator
        timeout-minutes: 4
        run: |
          started=$SECONDS
          simulator_udid="$(
            xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json
          import sys

          matches = [
              (runtime, device)
              for runtime, runtime_devices in json.load(sys.stdin)["devices"].items()
              for device in runtime_devices
              if device["name"] == "iPhone 17 Pro"
          ]
          if not matches:
              raise SystemExit("No available iPhone 17 Pro found")
          latest_runtime = max(
              [runtime for runtime, _ in matches],
              key=lambda runtime: tuple(
                  int(component)
                  for component in runtime.rsplit("iOS-", 1)[1].split("-")
              ),
          )
          devices = [
              device
              for runtime, device in matches
              if runtime == latest_runtime
          ]
          if len(devices) != 1:
              raise SystemExit(
                  f"Expected one iPhone 17 Pro for {latest_runtime}, found {len(devices)}"
              )
          print(devices[0]["udid"])
          '
          )"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "SPEEDREAD_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "| Simulator startup | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build tests
        timeout-minutes: 10
        run: |
          started=$SECONDS
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
            make build-for-testing
          echo "| Build for testing | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run all iOS integration tests
        timeout-minutes: 7
        run: |
          started=$SECONDS
          xcrun simctl bootstatus "$SPEEDREAD_SIMULATOR_UDID" -b
          mkdir -p .build/TestResults
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
          INTEGRATION_RESULT_BUNDLE=.build/TestResults/FullIntegration.xcresult \
            make unit-test-without-building
          echo "| All iOS integration tests | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain failed integration results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-integration-xcresult-${{ github.run_attempt }}
          path: apple/.build/TestResults/FullIntegration.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Run all UI and screenshot tests
        timeout-minutes: 15
        run: |
          mkdir -p .build/TestResults
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
          UI_RETRY=YES \
          UI_RESULT_BUNDLE=.build/TestResults/FullUI.xcresult \
            make ui-test-without-building

      - name: Summarize UI retries
        if: always()
        id: ui-summary
        run: |
          if [[ -d .build/TestResults/FullUI.xcresult ]]; then
            /usr/bin/python3 Tools/summarize_xcresult.py \
              .build/TestResults/FullUI.xcresult \
              --label "All UI and screenshot tests"
          else
            echo "retried=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate unsigned archive
        timeout-minutes: 10
        run: |
          started=$SECONDS
          make archive-check
          echo "| Unsigned archive | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain failed or retried UI results
        if: failure() || steps.ui-summary.outputs.retried == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-ui-xcresult-${{ github.run_attempt }}
          path: apple/.build/TestResults/FullUI.xcresult
          if-no-files-found: ignore
          retention-days: 7
