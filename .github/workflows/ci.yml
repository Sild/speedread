name: Fast CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi

          run_xcode=true
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}"; then
            run_xcode=false
            while IFS= read -r path; do
              if [[ ! "$path" =~ ^(AppStore/|docs/|AGENTS\.md$|README\.md$|ROADMAP\.md$|LICENSE) ]]; then
                run_xcode=true
                break
              fi
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi

          echo "run_xcode=$run_xcode" >> "$GITHUB_OUTPUT"
          echo "### Fast CI durations" >> "$GITHUB_STEP_SUMMARY"
          echo "| Phase | Result | Tests | Duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | ---: |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run portable preflight
        timeout-minutes: 2
        run: |
          started=$SECONDS
          make tooling-check cloudkit-static-check app-store-check
          echo "| Portable preflight | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Read pinned tool versions
        if: steps.changes.outputs.run_xcode == 'true'
        id: tool-versions
        run: |
          source Tools/versions.env
          echo "key=$XCODEGEN_VERSION-$SWIFTFORMAT_VERSION-$SWIFTLINT_VERSION-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned tools
        if: steps.changes.outputs.run_xcode == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/tools
          key: speedread-tools-${{ runner.os }}-${{ steps.tool-versions.outputs.key }}

      - name: Select Xcode 26.6
        if: steps.changes.outputs.run_xcode == 'true'
        run: |
          xcode_path=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode 26.6 is unavailable on this runner."
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install pinned tools
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 2
        run: ./Tools/install_tools.sh

      - name: Run deterministic project and static checks
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 2
        run: |
          started=$SECONDS
          make version-check cloudkit-check project-check format-check lint
          echo "| Project and static checks | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run native logic tests
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 2
        run: |
          started=$SECONDS
          make logic-test
          echo "| Native logic tests | Passed | 17 | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Start simulator
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 4
        run: |
          started=$SECONDS
          simulator_udid="$(
            xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json
          import sys

          matches = [
              (runtime, device)
              for runtime, runtime_devices in json.load(sys.stdin)["devices"].items()
              for device in runtime_devices
              if device["name"] == "iPhone 17 Pro"
          ]
          if not matches:
              raise SystemExit("No available iPhone 17 Pro found")
          latest_runtime = max(
              [runtime for runtime, _ in matches],
              key=lambda runtime: tuple(
                  int(component)
                  for component in runtime.rsplit("iOS-", 1)[1].split("-")
              ),
          )
          devices = [
              device
              for runtime, device in matches
              if runtime == latest_runtime
          ]
          if len(devices) != 1:
              raise SystemExit(
                  f"Expected one iPhone 17 Pro for {latest_runtime}, found {len(devices)}"
              )
          print(devices[0]["udid"])
          '
          )"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "SPEEDREAD_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "| Simulator startup | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build tests
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 10
        run: |
          started=$SECONDS
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
            make build-for-testing
          echo "| Build for testing | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run iOS integration tests
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 7
        run: |
          started=$SECONDS
          xcrun simctl bootstatus "$SPEEDREAD_SIMULATOR_UDID" -b
          mkdir -p .build/TestResults
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
          INTEGRATION_RESULT_BUNDLE=.build/TestResults/FastIntegration.xcresult \
            make unit-test-without-building
          echo "| iOS integration tests | Passed | - | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain failed integration results
        if: failure() && steps.changes.outputs.run_xcode == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-integration-xcresult-${{ github.run_attempt }}
          path: .build/TestResults/FastIntegration.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Run four UI journeys
        if: steps.changes.outputs.run_xcode == 'true'
        timeout-minutes: 7
        run: |
          mkdir -p .build/TestResults
          DESTINATION="platform=iOS Simulator,id=$SPEEDREAD_SIMULATOR_UDID" \
          UI_RETRY=YES \
          UI_RESULT_BUNDLE=.build/TestResults/FastUI.xcresult \
            make ui-smoke

      - name: Summarize UI retries
        if: always() && steps.changes.outputs.run_xcode == 'true'
        id: ui-summary
        run: |
          if [[ -d .build/TestResults/FastUI.xcresult ]]; then
            /usr/bin/python3 Tools/summarize_xcresult.py \
              .build/TestResults/FastUI.xcresult \
              --label "Four UI journeys"
          else
            echo "retried=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain failed or retried UI results
        if: failure() || steps.ui-summary.outputs.retried == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-ui-xcresult-${{ github.run_attempt }}
          path: .build/TestResults/FastUI.xcresult
          if-no-files-found: ignore
          retention-days: 7
