name: SpeedRead

options:
  bundleIdPrefix: com.sild
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: false
  groupSortPosition: top
  indentWidth: 4
  tabWidth: 4
  xcodeVersion: "26.6"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - Config/SpeedRead.storekit

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.8.0

settings:
  base:
    CURRENT_PROJECT_VERSION: 4
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1,2

targets:
  SpeedRead:
    type: application
    platform: iOS
    sources:
      - path: SpeedRead
    resources:
      - path: SpeedRead/Resources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SpeedRead/Resources/SpeedRead.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.speedread.app
        PRODUCT_NAME: SpeedRead
        SUPPORTS_MACCATALYST: NO
    info:
      path: SpeedRead/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpeedRead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        UIFileSharingEnabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: false

  SpeedReadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpeedReadTests
    dependencies:
      - target: SpeedRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.speedread.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SpeedRead.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SpeedRead

  SpeedReadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SpeedReadUITests
      - path: SpeedReadTests/Fixtures/epub3-cyrillic.epub
        buildPhase: resources
      - path: SpeedReadTests/Fixtures/long-chapter.epub
        buildPhase: resources
      - path: SpeedReadTests/Fixtures/pdf-metadata-outline.pdf
        buildPhase: resources
      - path: SpeedReadTests/Fixtures/pdf-image-only.pdf
        buildPhase: resources
      - path: SpeedReadTests/Fixtures/pdf-long-scanned.pdf
        buildPhase: resources
    dependencies:
      - target: SpeedRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.speedread.uitests
        TEST_TARGET_NAME: SpeedRead

  SpeedReadLogicTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - SpeedReadLogicTests
      - SpeedRead/Core/Domain/Book.swift
      - SpeedRead/Core/Domain/BookStatus.swift
      - SpeedRead/Core/Domain/LibraryFacetCounts.swift
      - SpeedRead/Core/Domain/LibraryFilter.swift
      - SpeedRead/Core/Domain/PublicationFormat.swift
      - SpeedRead/Core/Domain/ReaderEndDetection.swift
      - SpeedRead/Core/Domain/ReadingPosition.swift
      - SpeedRead/Core/Domain/TagNormalizer.swift
      - SpeedRead/Core/Domain/TagSelectionDraft.swift
      - SpeedRead/Core/Publication/SpeedContentProviding.swift
      - SpeedRead/Features/SpeedReader/SpeedReaderModels.swift
      - SpeedRead/Features/SpeedReader/SpeedReaderSession.swift
      - SpeedRead/Features/SpeedReader/SpeedTokenizer.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sild.speedread.logic-tests

schemes:
  SpeedRead:
    build:
      targets:
        SpeedRead: all
        SpeedReadTests: [test]
        SpeedReadUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/SpeedRead.storekit
    test:
      config: Debug
      gatherCoverageData: false
      testPlans:
        - path: Config/TestPlans/SpeedReadUnit.xctestplan
        - path: Config/TestPlans/SpeedReadFull.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SpeedReadIntegrationTests:
    build:
      targets:
        SpeedRead: all
        SpeedReadTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      testPlans:
        - path: Config/TestPlans/SpeedReadUnit.xctestplan
          defaultPlan: true

  SpeedReadLogicTests:
    build:
      targets:
        SpeedReadLogicTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SpeedReadLogicTests
          parallelizable: true
          randomExecutionOrder: true
